<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#8bc6df" />
  <meta name="description" content="Fog Nomad 0.4 — fuir une brume mortelle, ramasser ce qu'on peut porter, jeter ce qui ralentit." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fog Nomad — Vertical Slice 0.4</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%238bc6df'/%3E%3Ccircle cx='44' cy='19' r='8' fill='%23ffe9ac'/%3E%3Cpath d='M0 44 L18 30 L34 44 L48 34 L64 45 L64 64 L0 64 Z' fill='%2374a45d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Monde 3D procédural Horizon"></canvas>

    <section id="hud" aria-live="polite">
      <div class="brand">HORIZON <span>0.2</span></div>
      <div id="biome">Prairie</div>
      <div id="coordinates">X 0 · Z 0</div>
      <div id="chunk-count">25 chunks actifs</div>
      <div id="discovered-count">0 découverts</div>
      <div id="seed">Seed —</div>
    </section>

    <section id="run-hud" aria-live="off">
      <div class="gauge gauge-health">
        <span class="gauge-label">VIE</span>
        <div class="gauge-track"><i id="health-fill"></i></div>
      </div>
      <div class="gauge gauge-stamina">
        <span class="gauge-label">SOUFFLE</span>
        <div class="gauge-track"><i id="stamina-fill"></i></div>
      </div>
      <div class="gauge gauge-weight">
        <span class="gauge-label">SAC</span>
        <div class="gauge-track"><i id="weight-fill"></i></div>
        <span id="weight-value">0</span>
      </div>
    </section>

    <div id="fog-gauge">
      <strong id="fog-distance">—</strong>
      <span>BRUME</span>
    </div>

    <div id="collect-ring" hidden><i></i></div>

    <div id="bag-list" aria-label="Contenu du sac"></div>

    <div id="powers">
      <button id="use-crystal" type="button" hidden>
        <span class="glyph">◆</span>
        <span class="txt">REPOUSSER</span>
      </button>
      <button id="light-fire" type="button" hidden>
        <span class="glyph">▲</span>
        <span class="txt">FEU</span>
      </button>
    </div>

    <div id="pickup-feed" aria-live="polite"></div>
    <div id="pulse-flash" aria-hidden="true"></div>

    <div id="fog-vignette" aria-hidden="true"></div>

    <section id="death" hidden>
      <h1>RATTRAPÉ</h1>
      <p id="death-cause"></p>
      <dl id="death-stats"></dl>
      <button id="restart" type="button">RECOMMENCER</button>
    </section>

    <section id="intro">
      <strong>La brume monte. Ne t'arrête pas.</strong>
      <span>Ramasse ce que tu peux porter · jette ce qui te ralentit.</span>
    </section>

    <div id="joystick" aria-label="Joystick de déplacement">
      <div id="stick"></div>
    </div>

    <div id="actions">
      <button id="run" type="button" aria-label="Maintenir pour courir">
        <span>✦</span>
        COURIR
      </button>
      <button id="new-world" type="button">NOUVEAU</button>
    </div>

    <div id="loading">
      <div class="loading-mark">◌</div>
      <strong>HORIZON</strong>
      <span id="loading-message">Le monde prend forme…</span>
    </div>
  </main>

  <script type="module" src="./main.mjs"></script>

  <script>
    // Filet de sécurité : si le module ne démarre pas (WebGL indisponible,
    // script bloqué), l'écran de chargement doit dire pourquoi au lieu de
    // tourner indéfiniment.
    (function () {
      var message = document.getElementById("loading-message");
      var failed = false;

      function fail(text) {
        if (failed || document.body.classList.contains("ready")) return;
        failed = true;
        if (message) message.textContent = text;
        document.body.classList.add("failed");
      }

      window.addEventListener("error", function (event) {
        if (event.target && event.target.tagName === "SCRIPT") {
          fail("Le moteur 3D n'a pas pu être chargé.");
        } else if (event.message) {
          fail("Erreur au démarrage : " + event.message);
        }
      }, true);

      setTimeout(function () {
        if (!window.HORIZON) {
          fail("Démarrage impossible : WebGL est peut-être désactivé.");
        }
      }, 12000);
    })();
  </script>
</body>
</html>
